name: Extract project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Extract project files
        run: |
          unzip -o mini-mall-free.zip -d extracted
          cp -a extracted/. .
          rm -rf extracted
          rm -f mini-mall-free.zip

      - name: Commit and push extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          git diff --cached --quiet || git commit -m "Extract project files"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main
